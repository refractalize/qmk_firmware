layout:
  qmk_keyboard: zsa/voyager
layers:
  latenight:
    - ["$$mdi:camera$$", "⌘1", "⌘2", "⌘3", "$$mdi:volume-minus$$", "$$mdi:volume-plus$$", "$$mdi:play-pause$$", "$$mdi:rewind$$", "$$mdi:fast-forward$$", "$$mdi:skip-previous$$", "$$mdi:skip-next$$", ⌦]
    - [⇥, b, f, l, {t: d, h: accents}, j, "'", p, o, u, {t: ":", s: ";"}, ⌫]
    - [{t: ⎋, h: ⇧}, {t: n, h: ⌘}, {t: s, h: ^}, {t: h, h: ⌥}, {t: t, h: ⌘}, k, y, {t: c, h: ⌘}, {t: a, h: ⌥}, {t: e, h: ^}, {t: i, h: ⌘}, {t: ↵, h: ⇧}]
    - ["\\", x, v, m, g, q, z, w, {t: ".", s: "!"}, {t: "-", s: "?"}, {t: ",", s: "@"}, "/"]
    - [{t: "OS⇧", h: "num"}, {t: r, h: sym}, {t: "$$mdi:keyboard-space$$", h: ⇧}, {t: "_", h: nav}]
  game:
    - ["DF latenight", "DF latenight", "1", "2", "3", "4", "5", "6", "7", "8", "9", "0"]
    - [⌫, ⇥, q, w, e, r, t, home, up, end, o, p]
    - [⎋, ⇧, a, s, d, f, g, left, down, right, l, ";"]
    - [⇧, ^, z, x, c, v, b, n, m, {t: ",", s: "@"}, {t: ".", s: "!"}, "/"]
    - [↵, space, ↵, "DF latenight"]
  nav:
    - ["$$mdi:video$$", "PDF latenight", "PDF game", "⌘1", "⌘2", "⌘3", "⌘4", "⌘5", "⌘6", "⌘7", "⌘8", "⌘9"]
    - [{type: trans}, {type: trans}, {type: trans}, {type: trans}, {type: trans}, {type: trans}, "$$mdi:arrow-collapse-up$$", "$$mdi:arrow-collapse-left$$", "$$mdi:arrow-up$$", "$$mdi:arrow-collapse-right$$", {type: trans}, {type: trans}]
    - [{type: trans}, ⌘, ^, ⌥, ⌘, {type: trans}, "$$mdi:arrow-collapse-down$$", "$$mdi:arrow-left$$", "$$mdi:arrow-down$$", "$$mdi:arrow-right$$", {type: trans}, {type: trans}]
    - [{type: trans}, {type: trans}, {type: trans}, {type: trans}, {type: trans}, {type: trans}, {type: trans}, {type: trans}, {type: trans}, {type: trans}, {type: trans}, {type: trans}]
    - [⇧, {type: trans}, {type: trans}, {type: held}]
  sym:
    - [f1, f2, f3, f4, f5, f6, f7, f8, f9, f10, f11, f12]
    - [{type: trans}, "%", "$", "{", "}", "~", "^", "<", ">", {t: "-", s: "?"}, "&", {type: trans}]
    - [{type: trans}, {t: "@", h: ⌘}, {t: "\"", h: ^}, {t: "(", h: ⌥}, {t: ")", h: ⌘}, "+", "!", {t: "[", h: ⌘}, {t: "]", h: ⌥}, {t: "=", h: ^}, ";", {type: trans}]
    - [{type: trans}, "\\", "/", "[", "#", "#", "?", "*", "|", "`", "'", {type: trans}]
    - [{type: trans}, {type: held}, {type: trans}, {type: trans}]
  num:
    - ["⌥⌃f1", "⌥⌃f2", "⌥⌃f3", "⌥⌃f4", "⌥⌃f5", "⌥⌃f6", "⌥⌃f7", "⌥⌃f8", "⌥⌃f9", "⌥⌃f10", "⌥⌃f11", "⌥⌃f12"]
    - [{type: trans}, "`", "⌃w", "⇧⌥⇥", "⌥⇥", up, "*", "7", "8", "9", {t: "-", s: "?"}, {type: trans}]
    - [↵, pastehist, "⌃⇧c", "⌃c", "⌃v", down, "+", {t: "1", h: ⌘}, {t: "2", h: ⌥}, {t: "3", h: ^}, {t: ".", s: "!"}, {type: trans}]
    - [{type: trans}, "\"", "'", "⌃pgup", "⌃pgdn", "⌃⇧a", "/", "4", "5", "6", {t: ",", s: "@"}, {type: trans}]
    - [{type: held}, ↵, {type: trans}, "0"]
  accents:
    - [{type: trans}, {type: trans}, {type: trans}, {type: trans}, {type: trans}, {type: trans}, {type: trans}, {type: trans}, {type: trans}, {type: trans}, {type: trans}, {type: trans}]
    - [{type: trans}, {type: trans}, {type: trans}, {type: trans}, {type: held}, {type: trans}, {type: trans}, "ö", "ô", "ù", "¨", {type: trans}]
    - [{type: trans}, {type: trans}, {type: trans}, {type: trans}, {type: trans}, {type: trans}, {type: trans}, "ç", "à", "é", "ï", {type: trans}]
    - [{type: trans}, {type: trans}, {type: trans}, {type: trans}, {type: trans}, {type: trans}, {type: trans}, "è", "ê", "ë", {type: trans}, {type: trans}]
    - [{type: trans}, {type: trans}, {type: trans}, {type: trans}]
combos:
  - l: [latenight]
    p: [17, 29]
    k: "⇧v"
  - l: [latenight]
    p: [14, 15]
    k: "$"
  - l: [latenight]
    p: [43, 44]
    k: "../"
  - l: [latenight]
    p: [44, 45]
    k: "./"
  - l: [sym]
    p: [19, 20]
    k: "=>"
  - l: [sym]
    p: [20, 21]
    k: "->"
  - l: [num]
    p: [19, 20]
    k: "("
  - l: [num]
    p: [20, 21]
    k: ")"
  - l: [num]
    p: [31, 32]
    k: "["
  - l: [num]
    p: [32, 33]
    k: "]"
draw_config:
  key_w: 60.0
  key_h: 56.0
  split_gap: 30.0
  combo_w: 28.0
  combo_h: 26.0
  key_rx: 6.0
  key_ry: 6.0
  dark_mode: false
  n_columns: 1
  separate_combo_diagrams: false
  combo_diagrams_scale: 2
  inner_pad_w: 2.0
  inner_pad_h: 2.0
  outer_pad_w: 30.0
  outer_pad_h: 56.0
  line_spacing: 1.2
  arc_radius: 6.0
  append_colon_to_layer_header: true
  small_pad: 2.0
  legend_rel_x: 0.0
  legend_rel_y: 0.0
  draw_key_sides: false
  key_side_pars:
    rel_x: 0
    rel_y: 4
    rel_w: 12
    rel_h: 12
    rx: 4
    ry: 4
  svg_extra_style: ''
  footer_text: ''
  shrink_wide_legends: 7
  style_layer_activators: true
  glyph_tap_size: 14
  glyph_hold_size: 12
  glyph_shifted_size: 10
  glyphs: {}
parse_config:
  preprocess: true
  skip_binding_parsing: false
  raw_binding_map: {}
  sticky_label: sticky
  toggle_label: toggle
  tap_toggle_label: tap-toggle
  trans_legend:
    t: ▽
    type: trans
  layer_legend_map: {}
  mark_alternate_layer_activators: false
  modifier_fn_map:
    left_ctrl: Ctl
    right_ctrl: Ctl
    left_shift: ⇧
    right_shift: ⇧
    left_alt: ⌥
    right_alt: AltGr
    left_gui: ⌘
    right_gui: ⌘
    keycode_combiner: '{mods}+{key}'
    mod_combiner: '{mod_1}+{mod_2}'
    special_combinations:
      left_ctrl+left_alt+left_gui+left_shift: Hyper
      left_ctrl+left_alt+left_shift: Meh
  qmk_remove_keycode_prefix:
  - KC_
  qmk_keycode_map:
    XXXXXXX: ''
    'NO': ''
    MINUS: '-'
    MINS: '-'
    EQUAL: '='
    EQL: '='
    LEFT_BRACKET: '['
    LBRC: '['
    RIGHT_BRACKET: ']'
    RBRC: ']'
    BACKSLASH: \
    BSLS: \
    NONUS_HASH: '#'
